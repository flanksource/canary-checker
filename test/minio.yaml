# ABOUTME: S3 server (SeaweedFS) for e2e S3 tests, kept under the minio name the fixtures use.
# ABOUTME: Provides S3-compatible storage at minio.minio:9000 with test credentials.
apiVersion: v1
kind: Namespace
metadata:
  name: minio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: minio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        # MinIO no longer publishes container images; use the SeaweedFS S3 server that flanksource/duty's e2e tests use
        - name: minio
          image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
          args: ["mini", "-master.telemetry=false"]
          env:
            # SeaweedFS accepts only these S3 credentials, which the fixtures' aws-credentials secret uses
            - name: AWS_ACCESS_KEY_ID
              value: minio
            - name: AWS_SECRET_ACCESS_KEY
              value: minio123
          ports:
            - containerPort: 8333
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8333
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: minio
spec:
  ports:
    - port: 9000
      targetPort: 8333
      protocol: TCP
  selector:
    app: minio
