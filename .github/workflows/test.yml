on:
  push:
    tags:
      - v*
    branches:
      - master
  pull_request:
  merge_group:
name: Test
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x
          cache-dependency-path: '**/go.sum'
      - run: go install github.com/onsi/ginkgo/v2/ginkgo@v2.22.2
      - run: make -C test build
      - name: Upload E2E test binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-linux-amd64
          path: test/test.test
          if-no-files-found: error
          retention-days: 1
  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: minimal --skip-all, on: ubuntu-latest }
          - { name: k8s, on: ubuntu-latest }
          - { name: datasources, on: ubuntu-latest }
          - { name: opensearch, on: ubuntu-latest }
          # - { name: elasticsearch, on: ubuntu-latest }
          - { name: git, on: ubuntu-latest }
          # - restic
    runs-on: ${{ matrix.suite.on }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: 1.26.x
          cache-dependency-path: '**/go.sum'
      - name: Download E2E test binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: e2e-linux-amd64
          path: test
      - run: chmod +x test/test.test
      - run: make bin

      - name: Set up Kind cluster
        if: ${{ !contains(matrix.suite.name, '--skip-all') }}
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          cluster_name: kind-test
          config: test/kind-config.yaml

      - name: Wait for cluster ready
        if: ${{ !contains(matrix.suite.name, '--skip-all') }}
        run: kubectl wait --for=condition=Ready nodes --all --timeout=300s

      - name: Test
        env:
          KUBERNETES_VERSION: v1.30.6
          GH_TOKEN: ${{ secrets.CHECKRUNS_TOKEN }}
        run: ./test/e2e.sh fixtures/${{matrix.suite.name}}
      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@c950f6fb443cb5af20a377fd0dfaa78838901040 # v2.23.0
        if: always() &&  github.event.repository.fork == 'false'
        with:
          files: test/test-results.xml
          check_name: E2E - ${{matrix.suite.name}}
