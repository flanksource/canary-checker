apiVersion: canaries.flanksource.com/v1
kind: Canary
metadata:
  name: folder-fail
spec:
  schedule: "@every 5m"
  folder:
    - path: /etc/
      name: min count fail
      minCount: 100000
      maxAge: 4m
      metrics:
        - name: folder_error
          type: counter
          value: 'pass ? 0 : 1'
          labels:
            - name: error_type
              valueExpr: 'pass ? "none" : (errorType != "" ? errorType : "unknown")'
    - path: /etc/
      recursive: true
      name: min count recursive
      minCount: 100000
      maxAge: 4m
    - path: /etc/**/*
      name: min count glob
      minCount: 100000
      maxAge: 4m
